; NM-TV-154 PlatformIO Demo
; Target: ESP32 (esp32dev) + ST7789 240x240 + capacitive touch key (T9)

[platformio]
default_envs = nm-tv-154

[env:nm-tv-154]
platform = espressif32@6.6.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
extra_scripts = post:scripts/generate_full_image.py
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DNMTV154_BOARD
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DLOAD_GLCD=1
    -DCGRAM_OFFSET
    -DUSE_HSPI_PORT
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_MISO=-1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
lib_deps =
    Bodmer/TFT_eSPI
